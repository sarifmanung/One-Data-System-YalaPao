name: onedata-target

services:
  onedata-target-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: one_data_target
      MYSQL_USER: onedata
      MYSQL_PASSWORD: ${TARGET_DB_PASSWORD:-onedata_dev_password}
      MYSQL_ROOT_PASSWORD: ${TARGET_DB_ROOT_PASSWORD:-onedata_dev_root_password}
    ports:
      - "${TARGET_DB_PORT:-13307}:3306"
    volumes:
      - onedata-target-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uonedata", "-p${TARGET_DB_PASSWORD:-onedata_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  onedata-target-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ONEDATA_PROCESS_ROLE: api
      PORT: 3100
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: mysql://onedata:${TARGET_DB_PASSWORD:-onedata_dev_password}@onedata-target-db:3306/one_data_target
      CORS_ORIGIN: http://localhost:${TARGET_WEB_PORT:-3101}
      SPECIAL_ALLOWANCES_BASE_URL: ${SPECIAL_ALLOWANCES_BASE_URL:-}
      SPECIAL_ALLOWANCES_INTEGRATION_TOKEN: ${SPECIAL_ALLOWANCES_INTEGRATION_TOKEN:-}
      SPECIAL_ALLOWANCES_TIMEOUT_MS: ${SPECIAL_ALLOWANCES_TIMEOUT_MS:-10000}
      SPECIAL_ALLOWANCES_LEAVE_CONTRACT_VERSION: ${SPECIAL_ALLOWANCES_LEAVE_CONTRACT_VERSION:-1.0}
      ONEDATA_AFFILIATION_ID: ${ONEDATA_AFFILIATION_ID:-affiliation-yala-pao}
      ONEDATA_AFFILIATION_SOURCE_ID: ${ONEDATA_AFFILIATION_SOURCE_ID:-yala-pao}
      ONEDATA_AFFILIATION_CODE: ${ONEDATA_AFFILIATION_CODE:-YALA-PAO}
      ONEDATA_AFFILIATION_NAME: ${ONEDATA_AFFILIATION_NAME:-องค์การบริหารส่วนจังหวัดยะลา}
      PORTAL_TOKEN_ISSUER: ${PORTAL_TOKEN_ISSUER:-yala-pao-health-portal}
      PORTAL_TOKEN_AUDIENCE: ${ONEDATA_PORTAL_AUDIENCE:-one_data}
      PORTAL_SHARED_SECRET: ${PORTAL_SHARED_SECRET:-}
      ONEDATA_SESSION_COOKIE: ${ONEDATA_SESSION_COOKIE:-onedata_session}
      ONEDATA_SESSION_TTL_SECONDS: ${ONEDATA_SESSION_TTL_SECONDS:-28800}
      ONEDATA_SESSION_IDLE_TIMEOUT_SECONDS: ${ONEDATA_SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      ONEDATA_AUTH_RETENTION_SECONDS: ${ONEDATA_AUTH_RETENTION_SECONDS:-2592000}
      ONEDATA_SESSION_COOKIE_SECURE: ${ONEDATA_SESSION_COOKIE_SECURE:-}
      ONEDATA_SESSION_COOKIE_SAME_SITE: ${ONEDATA_SESSION_COOKIE_SAME_SITE:-lax}
      ONEDATA_SESSION_COOKIE_DOMAIN: ${ONEDATA_SESSION_COOKIE_DOMAIN:-}
      ONEDATA_CSRF_ENABLED: ${ONEDATA_CSRF_ENABLED:-true}
      ONEDATA_CSRF_REQUIRE_ORIGIN: ${ONEDATA_CSRF_REQUIRE_ORIGIN:-false}
      ONEDATA_RATE_LIMIT_ENABLED: ${ONEDATA_RATE_LIMIT_ENABLED:-true}
      ONEDATA_AUTH_RATE_LIMIT_PER_MINUTE: ${ONEDATA_AUTH_RATE_LIMIT_PER_MINUTE:-20}
      ONEDATA_MUTATION_RATE_LIMIT_PER_MINUTE: ${ONEDATA_MUTATION_RATE_LIMIT_PER_MINUTE:-120}
      ONEDATA_ALLOW_PROVISIONAL_LEAVE_RULES: ${ONEDATA_ALLOW_PROVISIONAL_LEAVE_RULES:-true}
      ONEDATA_DEV_AUTH_ENABLED: ${ONEDATA_DEV_AUTH_ENABLED:-false}
      ONEDATA_DEV_ROLE: ${ONEDATA_DEV_ROLE:-DEVELOPMENT_ONLY}
      ONEDATA_DEV_USER_ID: ${ONEDATA_DEV_USER_ID:-dev-user}
      ONEDATA_DEV_USERNAME: ${ONEDATA_DEV_USERNAME:-developer}
      ONEDATA_DEV_DISPLAY_NAME: ${ONEDATA_DEV_DISPLAY_NAME:-Local Developer}
      ONEDATA_DEV_EMPLOYEE_ID: ${ONEDATA_DEV_EMPLOYEE_ID:-}
      ONEDATA_DEV_WORKSPACE_KIND: ${ONEDATA_DEV_WORKSPACE_KIND:-tenant}
      ONEDATA_DEV_WORKSPACE_ID: ${ONEDATA_DEV_WORKSPACE_ID:-tenant-dev}
      ONEDATA_DEV_WORKSPACE_CODE: ${ONEDATA_DEV_WORKSPACE_CODE:-DEV-TENANT}
      ONEDATA_DEV_WORKSPACE_NAME: ${ONEDATA_DEV_WORKSPACE_NAME:-Development Health Center}
    ports:
      - "${TARGET_API_PORT:-3100}:3100"
    depends_on:
      onedata-target-db:
        condition: service_healthy
    # This compose file is the disposable/local target environment. Production
    # must use a reviewed Prisma migration instead of db push.
    command: ["sh", "-c", "npm run db:push -w @onedata/api -- --accept-data-loss && npm run db:seed -w @onedata/api && npm run start -w @onedata/api"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Start with --profile worker after the monthly/retry policy is approved.
  # The process uses the same reviewed API image and the same database boundary,
  # but never exposes an HTTP port.
  onedata-target-worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ONEDATA_PROCESS_ROLE: worker
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: mysql://onedata:${TARGET_DB_PASSWORD:-onedata_dev_password}@onedata-target-db:3306/one_data_target
      SPECIAL_ALLOWANCES_BASE_URL: ${SPECIAL_ALLOWANCES_BASE_URL:-}
      SPECIAL_ALLOWANCES_INTEGRATION_TOKEN: ${SPECIAL_ALLOWANCES_INTEGRATION_TOKEN:-}
      SPECIAL_ALLOWANCES_TIMEOUT_MS: ${SPECIAL_ALLOWANCES_TIMEOUT_MS:-10000}
      SPECIAL_ALLOWANCES_LEAVE_CONTRACT_VERSION: ${SPECIAL_ALLOWANCES_LEAVE_CONTRACT_VERSION:-1.0}
      ONEDATA_AUTH_RETENTION_SECONDS: ${ONEDATA_AUTH_RETENTION_SECONDS:-2592000}
      ONEDATA_WORKER_ENABLED: ${ONEDATA_WORKER_ENABLED:-false}
      ONEDATA_WORKER_MODE: ${ONEDATA_WORKER_MODE:-ALL}
      ONEDATA_WORKER_INTERVAL_MS: ${ONEDATA_WORKER_INTERVAL_MS:-60000}
      ONEDATA_WORKER_BATCH_SIZE: ${ONEDATA_WORKER_BATCH_SIZE:-10}
      ONEDATA_WORKER_ID: ${ONEDATA_WORKER_ID:-onedata-worker}
      ONEDATA_LEAVE_SNAPSHOT_MONTHLY_ENABLED: ${ONEDATA_LEAVE_SNAPSHOT_MONTHLY_ENABLED:-false}
      ONEDATA_LEAVE_SNAPSHOT_PERIOD: ${ONEDATA_LEAVE_SNAPSHOT_PERIOD:-}
      ONEDATA_LEAVE_SNAPSHOT_AFFILIATION_ID: ${ONEDATA_LEAVE_SNAPSHOT_AFFILIATION_ID:-}
      ONEDATA_LEAVE_SNAPSHOT_SOURCE_CUTOFF: ${ONEDATA_LEAVE_SNAPSHOT_SOURCE_CUTOFF:-}
      ONEDATA_LEAVE_SNAPSHOT_CUTOFF_DAYS: ${ONEDATA_LEAVE_SNAPSHOT_CUTOFF_DAYS:-3}
      ONEDATA_ALLOW_PROVISIONAL_LEAVE_RULES: ${ONEDATA_ALLOW_PROVISIONAL_LEAVE_RULES:-true}
    depends_on:
      onedata-target-db:
        condition: service_healthy
    command: ["npm", "run", "worker", "-w", "@onedata/api"]

  onedata-target-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ONEDATA_API_URL: http://onedata-target-api:3100
      ONEDATA_PUBLIC_WEB_URL: ${ONEDATA_PUBLIC_WEB_URL:-http://localhost:3101}
    depends_on:
      onedata-target-api:
        condition: service_healthy
    ports:
      - "${TARGET_WEB_PORT:-3101}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/tenant-dashboard').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  onedata-target-mysql-data:
