name: onedata-target-production

# Production template for shared-infra. All required values must come from the
# deployment secret store/environment; this file intentionally contains no
# credentials or fallback database passwords.
services:
  onedata-target-api:
    image: ${ONEDATA_TARGET_API_IMAGE:?ONEDATA_TARGET_API_IMAGE is required}
    environment:
      NODE_ENV: production
      ONEDATA_PROCESS_ROLE: api
      PORT: 3100
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      DATABASE_URL: ${ONEDATA_TARGET_DATABASE_URL:?ONEDATA_TARGET_DATABASE_URL is required}
      CORS_ORIGIN: ${ONEDATA_PUBLIC_WEB_URL:?ONEDATA_PUBLIC_WEB_URL is required}
      SPECIAL_ALLOWANCES_BASE_URL: ${SPECIAL_ALLOWANCES_BASE_URL:?SPECIAL_ALLOWANCES_BASE_URL is required}
      SPECIAL_ALLOWANCES_INTEGRATION_TOKEN: ${SPECIAL_ALLOWANCES_INTEGRATION_TOKEN:?SPECIAL_ALLOWANCES_INTEGRATION_TOKEN is required}
      SPECIAL_ALLOWANCES_TIMEOUT_MS: ${SPECIAL_ALLOWANCES_TIMEOUT_MS:-10000}
      SPECIAL_ALLOWANCES_LEAVE_CONTRACT_VERSION: ${SPECIAL_ALLOWANCES_LEAVE_CONTRACT_VERSION:-1.0}
      PORTAL_TOKEN_ISSUER: ${PORTAL_TOKEN_ISSUER:?PORTAL_TOKEN_ISSUER is required}
      PORTAL_TOKEN_AUDIENCE: ${PORTAL_TOKEN_AUDIENCE:?PORTAL_TOKEN_AUDIENCE is required}
      PORTAL_SHARED_SECRET: ${PORTAL_SHARED_SECRET:?PORTAL_SHARED_SECRET is required}
      ONEDATA_SESSION_COOKIE: ${ONEDATA_SESSION_COOKIE:-onedata_session}
      ONEDATA_SESSION_TTL_SECONDS: ${ONEDATA_SESSION_TTL_SECONDS:-28800}
      ONEDATA_SESSION_IDLE_TIMEOUT_SECONDS: ${ONEDATA_SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      ONEDATA_AUTH_RETENTION_SECONDS: ${ONEDATA_AUTH_RETENTION_SECONDS:-2592000}
      ONEDATA_SESSION_COOKIE_SECURE: "true"
      ONEDATA_SESSION_COOKIE_SAME_SITE: ${ONEDATA_SESSION_COOKIE_SAME_SITE:-lax}
      ONEDATA_SESSION_COOKIE_DOMAIN: ${ONEDATA_SESSION_COOKIE_DOMAIN:-}
      ONEDATA_TRUST_PROXY: ${ONEDATA_TRUST_PROXY:?ONEDATA_TRUST_PROXY is required; use explicit proxy IPs/CIDR ranges}
      ONEDATA_CSRF_ENABLED: ${ONEDATA_CSRF_ENABLED:-true}
      ONEDATA_CSRF_REQUIRE_ORIGIN: "true"
      ONEDATA_RATE_LIMIT_ENABLED: ${ONEDATA_RATE_LIMIT_ENABLED:-true}
      ONEDATA_AUTH_RATE_LIMIT_PER_MINUTE: ${ONEDATA_AUTH_RATE_LIMIT_PER_MINUTE:-20}
      ONEDATA_MUTATION_RATE_LIMIT_PER_MINUTE: ${ONEDATA_MUTATION_RATE_LIMIT_PER_MINUTE:-120}
      ONEDATA_ALLOW_PROVISIONAL_LEAVE_RULES: ${ONEDATA_ALLOW_PROVISIONAL_LEAVE_RULES:-false}
      ONEDATA_DEV_AUTH_ENABLED: "false"
    command: ["sh", "-c", "npm run db:migrate -w @onedata/api && npm run start -w @onedata/api"]
    networks:
      - default
      - webproxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  onedata-target-web:
    image: ${ONEDATA_TARGET_WEB_IMAGE:?ONEDATA_TARGET_WEB_IMAGE is required}
    environment:
      NODE_ENV: production
      ONEDATA_API_URL: http://onedata-target-api:3100
      ONEDATA_PUBLIC_WEB_URL: ${ONEDATA_PUBLIC_WEB_URL:?ONEDATA_PUBLIC_WEB_URL is required}
    depends_on:
      onedata-target-api:
        condition: service_healthy
    networks:
      - default
      - webproxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/tenant-dashboard').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  onedata-target-worker:
    profiles: ["worker"]
    image: ${ONEDATA_TARGET_API_IMAGE:?ONEDATA_TARGET_API_IMAGE is required}
    environment:
      NODE_ENV: production
      ONEDATA_PROCESS_ROLE: worker
      APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
      DATABASE_URL: ${ONEDATA_TARGET_DATABASE_URL:?ONEDATA_TARGET_DATABASE_URL is required}
      SPECIAL_ALLOWANCES_BASE_URL: ${SPECIAL_ALLOWANCES_BASE_URL:?SPECIAL_ALLOWANCES_BASE_URL is required}
      SPECIAL_ALLOWANCES_INTEGRATION_TOKEN: ${SPECIAL_ALLOWANCES_INTEGRATION_TOKEN:?SPECIAL_ALLOWANCES_INTEGRATION_TOKEN is required}
      SPECIAL_ALLOWANCES_TIMEOUT_MS: ${SPECIAL_ALLOWANCES_TIMEOUT_MS:-10000}
      SPECIAL_ALLOWANCES_LEAVE_CONTRACT_VERSION: ${SPECIAL_ALLOWANCES_LEAVE_CONTRACT_VERSION:-1.0}
      ONEDATA_AUTH_RETENTION_SECONDS: ${ONEDATA_AUTH_RETENTION_SECONDS:-2592000}
      ONEDATA_WORKER_ENABLED: ${ONEDATA_WORKER_ENABLED:-false}
      ONEDATA_WORKER_MODE: ${ONEDATA_WORKER_MODE:-ALL}
      ONEDATA_WORKER_INTERVAL_MS: ${ONEDATA_WORKER_INTERVAL_MS:-60000}
      ONEDATA_WORKER_BATCH_SIZE: ${ONEDATA_WORKER_BATCH_SIZE:-10}
      ONEDATA_WORKER_ID: ${ONEDATA_WORKER_ID:-onedata-worker}
      ONEDATA_LEAVE_SNAPSHOT_MONTHLY_ENABLED: ${ONEDATA_LEAVE_SNAPSHOT_MONTHLY_ENABLED:-false}
      ONEDATA_LEAVE_SNAPSHOT_PERIOD: ${ONEDATA_LEAVE_SNAPSHOT_PERIOD:-}
      ONEDATA_LEAVE_SNAPSHOT_AFFILIATION_ID: ${ONEDATA_LEAVE_SNAPSHOT_AFFILIATION_ID:-}
      ONEDATA_LEAVE_SNAPSHOT_SOURCE_CUTOFF: ${ONEDATA_LEAVE_SNAPSHOT_SOURCE_CUTOFF:-}
      ONEDATA_LEAVE_SNAPSHOT_CUTOFF_DAYS: ${ONEDATA_LEAVE_SNAPSHOT_CUTOFF_DAYS:-3}
      ONEDATA_ALLOW_PROVISIONAL_LEAVE_RULES: ${ONEDATA_ALLOW_PROVISIONAL_LEAVE_RULES:-false}
      ONEDATA_DEV_AUTH_ENABLED: "false"
    command: ["npm", "run", "worker", "-w", "@onedata/api"]
    networks:
      - default
      - webproxy

networks:
  default:
  webproxy:
    external: true
